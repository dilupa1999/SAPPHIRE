<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clinic Reception & Welcome Area - Image Preview</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card-box {
      background: #ffffff;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .card-title {
      font-size: 18px;
      color: #5c0322;
      margin-bottom: 16px;
      font-weight: bold;
    }
    .img-wrapper {
      width: 100%;
      height: 550px;
      border-radius: 12px;
      overflow: hidden;
      background: #e2e8f0;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.07);
      margin-bottom: 20px;
    }
    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .btn-download {
      display: inline-block;
      background-color: #5c0322;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 30px;
      transition: background-color 0.3s ease;
    }
    .btn-download:hover {
      background-color: #7d0731;
    }
    .note-text {
      margin-top: 14px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="card-box">
    <div class="card-title">Clinic Reception & Friendly Team</div>
    
    <div class="img-wrapper">
      <!-- 3:4 Portrait High Quality Image for Clinic Reception / Patient Care -->
      <img src="https://images.unsplash.com/photo-1576765608535-5f04d1e3f289?auto=format&fit=crop&w=800&q=80" 
           alt="Friendly Clinic Reception and Nurse Greeting Patient" />
    </div>

    <a href="https://images.unsplash.com/photo-1576765608535-5f04d1e3f289?auto=format&fit=crop&w=800&q=80" 
       target="_blank" 
       download="sapphire-clinic-reception.jpg" 
       class="btn-download">
      Image Download Kara (550px Height)
    </a>

    <p class="note-text">
      Hi image download karun tumchya website chya <code>assets/img/about/</code> folder madhye theva.
    </p>
  </div>

</body>
</html>
